async function claude(msgs,maxTok=2000){
  const r=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':S.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:maxTok,messages:msgs})
  });
  if(!r.ok){const e=await r.json();throw new Error(e.error?.message||'Error API '+r.status);}
  const d=await r.json();return d.content?.[0]?.text||'';
}

function mCard(raw,cds){
  const s=(raw||'').toLowerCase();
  if(s.includes('amex')||s.includes('american'))return cds.includes('American Express')?'American Express':cds[0];
  if(s.includes('bbva'))return cds.includes('BBVA')?'BBVA':cds[0];

}
function mCat(h,cts,en){
  const s=(h||'').toLowerCase();const last=cts[cts.length-1].id;

// ══════════════════════════════════════════════════════
// INSIGHTS ENGINE
// ══════════════════════════════════════════════════════
function detectRecurring(txs){
  const g={};
  txs.forEach(t=>{
    const k=t.merchant.toLowerCase().replace(/[^a-záéíóúñ0-9]/gi,' ').replace(/\s+/g,' ').trim();
    if(!g[k])g[k]=[];g[k].push(t);
  });
  return Object.entries(g).filter(([,l])=>l.length>=2).map(([,l])=>{
    l.sort((a,b)=>new Date(a.date)-new Date(b.date));
    const amts=l.map(t=>parseFloat(t.amount||0));
    const avg=amts.reduce((s,a)=>s+a,0)/amts.length;
    const sim=avg>0&&amts.every(a=>Math.abs(a-avg)/(avg||1)<0.25);
    if(!sim)return null;
    const intervals=[];
    for(let i=1;i<l.length;i++)intervals.push((new Date(l[i].date)-new Date(l[i-1].date))/(1000*60*60*24));
    const avgI=intervals.length?intervals.reduce((s,d)=>s+d,0)/intervals.length:0;
    const isMonthly=avgI>=20&&avgI<=45;
    return{merchant:l[0].merchant,count:l.length,avg,currency:l[0].currency,dates:l.map(t=>t.date),isMonthly,card:l[0].card,entity:l[0].entity};
  }).filter(Boolean);
}
function detectDupes(txs){
  const dupes=[];
  for(let i=0;i<txs.length;i++)for(let j=i+1;j<txs.length;j++){
    const a=txs[i],b=txs[j];
    const days=Math.abs(new Date(a.date)-new Date(b.date))/(1000*60*60*24);
    if(a.card===b.card&&a.merchant.toLowerCase()===b.merchant.toLowerCase()&&parseFloat(a.amount||0)===parseFloat(b.amount||0)&&a.currency===b.currency&&days<=7){
      if(!dupes.some(d=>d.ids.includes(a.id)&&d.ids.includes(b.id)))
        dupes.push({merchant:a.merchant,amount:parseFloat(a.amount||0),currency:a.currency,card:a.card,dates:[a.date,b.date],ids:[a.id,b.id],days:Math.round(days)});
    }
  }
  return dupes;
}

// ── DASHBOARD ──────────────────────────────────────────────────────────────
function rDash(){
  const cts=cats();

  const pmxn=S.txs.filter(t=>t.entity===S.entity&&t.date?.startsWith(pm())&&t.currency==='MXN');
  const usd=S.txs.filter(t=>t.entity===S.entity&&t.date?.startsWith(cm())&&t.currency==='USD');
  const tot=mxn.reduce((s,t)=>s+parseFloat(t.amount||0),0);
  const ptot=pmxn.reduce((s,t)=>s+parseFloat(t.amount||0),0);

  if(!mxn.length&&!usd.length)return`<div class="empty"><div class="ei">📊</div><p style="font-size:14px">Sin datos este mes</p><p style="font-size:12px;margin-top:4px">Config → Cargar datos de ejemplo</p></div>`;
  const topC=cts.map(c=>({...c,v:mxn.filter(t=>t.category===c.id).reduce((s,t)=>s+parseFloat(t.amount||0),0)})).filter(d=>d.v>0).sort((a,b)=>b.v-a.v)[0];
  return`
<div class="sgrid">
  <div class="sbox"><div class="sl">Gasto MXN este mes</div><div class="sv" style="font-size:17px">${fS(tot)}</div>${diff!==null?`<p style="font-size:10px;margin-top:2px;color:${parseFloat(diff)>0?'#ef4444':'#10b981'}">${parseFloat(diff)>0?'▲':'▼'} ${Math.abs(diff)}% vs anterior</p>`:''}</div>
  <div class="sbox"><div class="sl">Transacciones</div><div class="sv">${mxn.length+usd.length}</div><p style="font-size:10px;color:#64748b;margin-top:2px">Prom: ${fS(tot/(mxn.length||1))}</p></div>
</div>
${topC?`<div class="sbox" style="margin-bottom:12px;display:flex;align-items:center;gap:12px"><span style="font-size:28px">${topC.ic}</span><div><p style="font-size:11px;color:#94a3b8">Mayor categoría este mes</p><p style="font-size:15px;font-weight:700">${topC.n}</p><p style="font-size:13px;color:#6366f1">${fS(topC.v)}</p></div></div>`:''}
<div class="card" style="padding:12px"><p class="stit">Gasto por Categoría (MXN)</p><canvas id="pChart" height="180"></canvas><div id="pLeg" style="margin-top:8px"></div></div>

${usd.length?`<div class="card" style="padding:12px"><p class="stit">Gastos en USD este mes</p>${usd.map(t=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #1e293b"><div><p style="font-size:13px;font-weight:500">${esc(t.merchant)}</p><p style="font-size:11px;color:#64748b">${t.card} · ${t.date}</p></div><p style="font-size:13px;font-weight:700">USD ${parseFloat(t.amount||0).toLocaleString('en-US',{minimumFractionDigits:2})}</p></div>`).join('')}<p style="font-size:11px;color:#64748b;margin-top:8px">Total: USD ${usd.reduce((s,t)=>s+parseFloat(t.amount||0),0).toLocaleString('en-US',{minimumFractionDigits:2})}</p></div>`:''}`;
}

function initCharts(){
  const cts=cats();
  const mxn=S.txs.filter(t=>t.entity===S.entity&&t.date?.startsWith(cm())&&t.currency==='MXN');
  const pe=document.getElementById('pChart');
  if(pe){
    const cd=cts.map(c=>({lb:c.ic+' '+c.n,v:mxn.filter(t=>t.category===c.id).reduce((s,t)=>s+parseFloat(t.amount||0),0)})).filter(d=>d.v>0);
    if(cd.length){
      S.charts.pie=new Chart(pe.getContext('2d'),{type:'doughnut',data:{labels:cd.map(d=>d.lb),datasets:[{data:cd.map(d=>d.v),backgroundColor:CC,borderWidth:0}]},options:{responsive:true,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' '+fF(c.raw)}}}}});
      const lg=document.getElementById('pLeg');
      if(lg)lg.innerHTML=cd.slice(0,6).map((d,i)=>`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><div style="display:flex;align-items:center;gap:6px"><div style="width:8px;height:8px;border-radius:2px;background:${CC[i%CC.length]}"></div><span style="font-size:12px;color:#cbd5e1">${d.lb}</span></div><span style="font-size:12px;font-weight:600">${fS(d.v)}</span></div>`).join('');

    if(cd.length)S.charts.bar=new Chart(be.getContext('2d'),{type:'bar',data:{labels:cd.map(d=>d.lb),datasets:[{data:cd.map(d=>d.v),backgroundColor:CC,borderRadius:6,borderWidth:0}]},options:{responsive:true,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' '+fF(c.raw)}}},scales:{x:{grid:{display:false},ticks:{color:'#94a3b8',font:{size:11}}},y:{display:false}}}});
  }
}

// ── INSIGHTS ───────────────────────────────────────────────────────────────
function rInsights(){

  const thisMon=etxs.filter(t=>t.date?.startsWith(cm())&&t.currency==='MXN').reduce((s,t)=>s+parseFloat(t.amount||0),0);
  const prevMon=etxs.filter(t=>t.date?.startsWith(pm())&&t.currency==='MXN').reduce((s,t)=>s+parseFloat(t.amount||0),0);
  const recMXN=rec.filter(r=>r.isMonthly&&r.currency==='MXN').reduce((s,r)=>s+r.avg,0);
  return`
<div class="card" style="text-align:center">
  <div style="font-size:32px;margin-bottom:6px">🤖</div>
  <h2 style="font-size:14px;font-weight:700;margin-bottom:4px">Análisis Inteligente con Claude</h2>

</div>
<div class="sgrid">
  <div class="sbox"><div class="sl">Este mes</div><div class="sv" style="font-size:16px">${fS(thisMon)}</div></div>
  <div class="sbox"><div class="sl">Mes anterior</div><div class="sv" style="font-size:16px">${fS(prevMon)}</div>${prevMon?`<p style="font-size:10px;margin-top:2px;color:${thisMon>prevMon?'#ef4444':'#10b981'}">${thisMon>prevMon?'▲':'▼'} ${Math.abs(((thisMon-prevMon)/prevMon)*100).toFixed(0)}%</p>`:''}</div>
</div>
${recMXN>0?`<div class="sbox" style="margin-bottom:12px;display:flex;align-items:center;gap:12px"><span style="font-size:28px">🔁</span><div><p style="font-size:11px;color:#94a3b8">Cargos domiciliados mensuales</p><p style="font-size:16px;font-weight:700;color:#f59e0b">${fS(recMXN)}/mes</p><p style="font-size:11px;color:#64748b">~${fS(recMXN*12)}/año estimado</p></div></div>`:''}
${dup.length?`<p class="stit" style="color:#ef4444">🚨 Posibles Duplicados (${dup.length})</p>${dup.map(d=>`<div class="ic id"><div style="display:flex;justify-content:space-between;align-items:start"><div><p style="font-weight:700;font-size:13px">⚠️ ${esc(d.merchant)}</p><p style="font-size:11px;color:#94a3b8;margin-top:2px">${d.card} · ${d.currency}</p><p style="font-size:11px;color:#94a3b8">Fechas: ${d.dates.join(' y ')}${d.days>0?' ('+d.days+' días)':''}</p></div><p style="font-weight:700;color:#ef4444;font-size:14px;flex-shrink:0">${fS(d.amount)}</p></div><p style="font-size:11px;color:#fca5a5;margin-top:6px">💡 Verifica si este cargo aparece duplicado en tu estado de cuenta.</p></div>`).join('')}`:`<div class="ic iok" style="margin-bottom:12px"><p style="font-weight:600;font-size:13px;color:#34d399">✅ Sin duplicados detectados</p></div>`}
<p class="stit" style="margin-top:4px">🔁 Cargos Recurrentes / Domiciliados (${rec.length})</p>
${!rec.length?`<div class="ic iok"><p style="font-size:12px;color:#94a3b8">Registra más transacciones para detectar recurrentes automáticamente.</p></div>`:''}
${rec.map(r=>`<div class="ic ir"><div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:6px"><div style="flex:1;min-width:0"><p style="font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.merchant)}</p><p style="font-size:11px;color:#94a3b8;margin-top:2px">${r.card} · ${r.count} veces · ${r.isMonthly?'<span style="color:#f59e0b">~Mensual</span>':'Periódico'}</p></div><div style="text-align:right;flex-shrink:0;margin-left:8px"><p style="font-weight:700;font-size:13px">${fS(r.avg)}</p><p style="font-size:10px;color:#94a3b8">${r.currency}/vez</p></div></div><p style="font-size:11px;color:#94a3b8">Fechas: ${r.dates.slice(-3).join(' · ')}</p>${r.isMonthly?`<p style="font-size:11px;color:#fbbf24;margin-top:4px">💡 ~${fS(r.avg)}/mes · Anual estimado: ${fS(r.avg*12)}</p>`:''}</div>`).join('')}
${S.insRes?`<p class="stit" style="margin-top:8px">🤖 Recomendaciones Claude</p><div class="card" style="padding:14px"><p style="font-size:13px;color:#cbd5e1;line-height:1.6;white-space:pre-wrap">${esc(S.insRes)}</p></div>`:``}`;

function rTxRow(t,del=false){

async function doImg(inp){
  const f=inp.files?.[0];if(!f)return;
  S.loading=true;S.error='';render();
  try{
    const data=await b64(f);
    const isE=S.entity==='empresarial';
    const p=`Analiza este voucher de pago y extrae en JSON exacto. Usa null si no encuentras el campo.
{"merchant":"nombre del comercio","amount":número total sin símbolo de moneda,"currency":"MXN o USD o código ISO de 3 letras","date":"YYYY-MM-DD","time":"HH:MM","card_type":"American Express/Amex/BBVA/Santander/Banamex/Morgan Stanley/Clara u otra","category_hint":"restaurante/supermercado/gasolina/farmacia/entretenimiento/ropa/hotel/transporte/tecnologia/suscripcion u otra"${isE?`,"rfc_proveedor":"RFC del proveedor si aparece en el voucher o null","folio_cfdi":"folio fiscal UUID si aparece o null"`:''},"msi_months":número de meses si es compra a MSI o null}
Responde SOLO con el JSON, sin explicación ni markdown.`;
    const raw=await claude([{role:'user',content:[{type:'image',source:{type:'base64',media_type:f.type||'image/jpeg',data}},{type:'text',text:p}]}]);
    const ext=sj(raw);
    const cds=cards();const cts=cats();
    const card=mCard(ext.card_type,cds);
    S.cur={id:Date.now().toString(),entity:S.entity,card,merchant:ext.merchant||'',category:mCat(ext.category_hint,cts,S.entity),amount:ext.amount||'',currency:ext.currency||'MXN',date:ext.date||td(),time:ext.time||nt(),msi:MC.includes(card)&&ext.msi_months?ext.msi_months:null,cfdi:isE?{rfc:ext.rfc_proveedor||'',folio:ext.folio_cfdi||''}:null,status:'pending',b64:data,mime:f.type||'image/jpeg',createdAt:new Date().toISOString()};
    S.screen='review';
  }catch(e){S.error='Error al analizar: '+(e.message||'Intenta de nuevo.');}
  S.loading=false;render();inp.value='';
}

async function doPDF(inp){
  const f=inp.files?.[0];if(!f)return;
  S.loading=true;S.error='';render();
  try{
    const data=await b64(f);
    const pend=S.txs.filter(t=>t.entity===S.entity&&t.status!=='reconciled');
    const sum=pend.map(t=>`ID:${t.id}|${t.card}|${t.merchant}|${t.amount}${t.currency}|${t.date}`).join('\n');
    const p=`Eres asistente de conciliación financiera mexicana.\nTRANSACCIONES REGISTRADAS:\n${sum||'Ninguna'}\n\nAnaliza el estado de cuenta PDF, extrae todos los cargos y concilia con las transacciones registradas.\nResponde SOLO con JSON:\n{"card_name":"nombre tarjeta","cut_date":"YYYY-MM-DD","total_balance":número,"currency":"MXN","statement_txs":[{"merchant":"nombre","amount":número,"date":"YYYY-MM-DD","matched_id":"ID o null","status":"matched|unrecognized"}],"summary":"resumen ejecutivo 2-3 líneas"}`;
    const raw=await claude([{role:'user',content:[{type:'document',source:{type:'base64',media_type:'application/pdf',data}},{type:'text',text:p}]}]);
    const res=sj(raw);
    if(res.statement_txs){const ids=res.statement_txs.filter(t=>t.matched_id).map(t=>t.matched_id);S.txs=S.txs.map(t=>ids.includes(t.id)?{...t,status:'reconciled'}:t);save();}
    S.reconRes=res;S.screen='rres';
  }catch(e){S.error='Error al procesar PDF: '+(e.message||'Intenta de nuevo.');}
  S.loading=false;render();inp.value='';
}

function doConfirm(){
  if(!S.cur)return;

  const etxs=S.txs.filter(t=>t.entity===S.entity);
  if(etxs.length<3)return;
  S.loading=true;S.error='';render();
  try{
    const cts=S.entity==='personal'?S.pCats:S.eCats;
    const sum=etxs.map(t=>{const cat=cts.find(c=>c.id===t.category);return`${t.date}|${t.card}|${t.merchant}|${cat?.n||t.category}|${t.amount}|${t.currency}${t.msi?'|'+t.msi+'MSI':''}`;}).join('\n');

}

function doExport(){
  const h=['Fecha','Hora','Entidad','Tarjeta','Comercio','Categoría','Monto','Moneda','MSI','Estado','RFC','Folio CFDI'];

  const csv=[h,...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  Object.assign(document.createElement('a'),{href:url,download:`VoucherPro_${td()}.csv`}).click();
  URL.revokeObjectURL(url);
}
