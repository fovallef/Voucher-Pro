.__vpLog&&window.__vpLog.length)?window.__vpLog.slice(-15).reverse().map(e=>'<div style="background:var(--bg3);border-radius:6px;padding:6px 8px;margin-bottom:4px;font-size:10px;font-family:monospace"><span style="color:var(--tx3)">'+(new Date(e.at).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',second:'2-digit'}))+'</span> '+esc(e.msg.replace('[VoucherPro] ',''))+'</div>').join(''):'<p style="font-size:11px;color:var(--tx3);text-align:center;padding:8px">Sin eventos registrados</p>'}<button class="btn bs" id="logCopy" style="width:100%;padding:9px;font-size:13px;margin-top:6px">&#x1F4CB; Copiar log al portapapeles</button><button class="btn bs" id="logClear" style="width:100%;padding:9px;font-size:12px;margin-top:4px;color:var(--tx2)">&#x1F5D1;&#xFE0F; Limpiar log</button></div>`;}
function attachSettings(){document.getElementById('cfgVerCard')?.addEventListener('click',()=>{if(confirm('¿Forzar recarga? Bajará la última versión del servidor (~10s).'))location.reload();});document.getElementById('addCatBtn')?.addEventListener('click',()=>{const v=(document.getElementById('newCatIn')?.value||'').trim();if(!v)return;const nc={id:'c_'+uid(),n:v,ic:'📦',custom:true};if(S.entity==='personal')S.pCats=[...S.pCats.slice(0,-1),nc,S.pCats[S.pCats.length-1]];else S.eCats=[...S.eCats.slice(0,-1),nc,S.eCats[S.eCats.length-1]];persist();render();});document.getElementById('newCatIn')?.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('addCatBtn')?.click();});document.getElementById('addCardBtn')?.addEventListener('click',()=>{const v=(document.getElementById('newCardIn')?.value||'').trim();if(!v)return;if(S.entity==='personal')S.pCards=[...S.pCards,{name:v,cutDay:null}];else S.eCards=[...S.eCards,{name:v,cutDay:null}];persist();render();});document.getElementById('newCardIn')?.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('addCardBtn')?.click();});document.querySelectorAll('[data-editcat]').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.editcat;const cts=cats();const cat=cts.find(c=>c.id===id);if(!cat)return;S.editModal={type:'cat',id,current:cat.n};render();}));document.querySelectorAll('[data-delcat]').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.delcat;if(!confirm('¿Eliminar esta categoría?'))return;if(S.entity==='personal')S.pCats=S.pCats.filter(c=>c.id!==id);else S.eCats=S.eCats.filter(c=>c.id!==id);persist();render();}));document.querySelectorAll('[data-editcard]').forEach(b=>b.addEventListener('click',()=>{S.editModal={type:'card',id:b.dataset.editcard,current:b.dataset.editcard};render();}));document.querySelectorAll('[data-editcut]').forEach(b=>b.addEventListener('click',()=>{const name=b.dataset.editcut;const arr=S.entity==='personal'?S.pCards:S.eCards;const card=arr.find(c=>c.name===name);const day=prompt('Día de corte para '+name+' (1-31, vacío para quitar):',card?.cutDay||'');if(day===null)return;const d=parseInt(day);if(day===''&&card){card.cutDay=null;persist();render();}
else if(d>=1&&d<=31&&card){card.cutDay=d;persist();render();}
else if(day!=='')alert('Ingresa un día entre 1 y 31.');}));document.querySelectorAll('[data-delcard]').forEach(b=>b.addEventListener('click',()=>{const name=b.dataset.delcard;if(!confirm(`¿Eliminar tarjeta"${name}"?`))return;if(S.entity==='personal')S.pCards=S.pCards.filter(c=>c.name!==name);else S.eCards=S.eCards.filter(c=>c.name!==name);persist();render();}));document.getElementById('sampleBtn')?.addEventListener('click',loadSample);document.getElementById('exportBtn')?.addEventListener('click',doExport);document.getElementById('importBtn')?.addEventListener('click',()=>document.getElementById('csvImportIn')?.click());document.getElementById('csvImportIn')?.addEventListener('change',doImportCSV);document.getElementById('saveGcidBtn')?.addEventListener('click',()=>{const v=(document.getElementById('gcidIn')?.value||'').trim();S.gmailClientId=v;persist();alert(v?'✅ Client ID guardado':'Client ID eliminado');render();});document.getElementById('changeKeyBtn')?.addEventListener('click',()=>{const box=document.getElementById('akChangeBox');if(box)box.style.display=box.style.display==='none'?'block':'none';});document.getElementById('akChangeSave')?.addEventListener('click',()=>{const v=(document.getElementById('akChangeInput')?.value||'').trim();if(!v||!v.startsWith('sk-ant-')){alert('Clave inválida. Debe comenzar con sk-ant-');return;}S.apiKey=v;persist();const box=document.getElementById('akChangeBox');if(box)box.style.display='none';alert('✅ API Key actualizada correctamente.');});document.getElementById('gmailSettingsBtn')?.addEventListener('click',()=>{S.tab='settings';S.screen='main';render();setTimeout(()=>document.getElementById('gcidIn')?.focus(),100);});document.getElementById('clearGmailBtn')?.addEventListener('click',()=>{const n=S.importedEmailIds?.length||0;if(!confirm('¿Borrar el historial de '+n+' emails procesados?\n\nEsto hará que Gmail los revise de nuevo en el próximo import.\nÚsalo si crees que algún cargo fue clasificado incorrectamente.'))return; function cleanEmailBody(html){const stripped=(html||'').replace(/<[^>]+>/g,' ').replace(/&[a-z#0-9]+;/gi,' ');const lines=stripped.split(/\n+/).map(l=>l.replace(/\s+/g,' ').trim()).filter(l=>l.length>3);const relevant=lines.filter(l=>/\$|total|pagado|pedido|orden|order|entregado|monto|importe|receipt|invoice|charged|amount|usd|mxn|cobro|payment|paid|suscripci|membresia|membresía/i.test(l));return(relevant.length>0?relevant.join(' | '):stripped.replace(/\s+/g,' ')).slice(0,2500);}
async function parseEmail(em){const s=(em.subj||'').toLowerCase();const fromL=(em.from||'').toLowerCase();if(/programad|scheduled|en camino|out for delivery|enviado|shipped|tracking/i.test(s)||/hemos recibido|order received|pedido recibido/.test(s)||s.includes('cancelad')||/^entregado[:\s]/i.test(em.subj||'')){return{tipo:'otro',merchant:'',amount:0,currency:'MXN',date:(em.date||'').slice(0,10),category:'otro'};}const regAmt=extractAmount(em.body)||extractAmount(cleanEmailBody(em.body));const isReceiptSubj=s.includes('receipt')||s.includes('invoice')||s.includes('recibo')||s.includes('factura');const isDeliverySubj=s.includes('fue entregado')||s.includes('pedido entregado')||/^entregado[:\s]/i.test(s);const isRappiReceipt=/^pedido:\s*['"]/.test(em.subj)&&(fromL.includes('rappi')||fromL.includes('recibos'));if(isReceiptSubj||isDeliverySubj||isRappiReceipt){const isAmzDelivery=/^entregado[:\s]/i.test(s);const rawMerchant=isAmzDelivery?'Amazon':(em.subj.replace(/your receipt from\s*/i,'').replace(/tu recibo de\s*/i,'').replace(/^recibo de\s*/i,'').replace(/^pedido:\s*/i,'').replace(/francisco ovalle felix,?\s*/i,'').replace(/#[0-9-]+/g,'').replace(/\|\s*pedido.*/i,'').replace(/fue entregado.*/i,'').replace(/tu pedido de\s*/i,'').replace(/['"]*/g,'').trim().slice(0,60)||'Sin nombre');const isForeign=fromL.includes('elevenlabs')||fromL.includes('stripe')||fromL.includes('paypal');let finalAmt=regAmt;if(!finalAmt){try{const cSnippet=cleanEmailBody(em.body).slice(0,800);const qa=await callClaude([{role:'user',content:[{type:'text',text:'Monto total cobrado en este recibo. Responde SOLO con el número (ej: 1234.56). Si no hay monto, responde: 0.\n\n'+cSnippet}]}],80);const qn=parseFloat((qa||'0').replace(/[^0-9.]/g,''));if(qn>0)finalAmt=qn;}catch(e){}}return{tipo:'cargo_real',merchant:rawMerchant,amount:finalAmt||0,currency:isForeign?'USD':'MXN',date:extractDate(em.body)||em.date,category:isDeliverySubj?'restaurantes':'suscripciones'};}const cleanBody=cleanEmailBody(em.body);let ctx='';if(fromL.includes('stripe'))ctx+='Remitente Stripe. ';if(fromL.includes('amazon'))ctx+='Email Amazon. ';if(fromL.includes('zettle')||fromL.includes('izettle'))ctx+='Recibo Zettle. ';if(fromL.includes('paypal'))ctx+='Email PayPal. ';if(regAmt&&regAmt>0)ctx+='Monto encontrado: '+regAmt+'. ';const p='Clasifica este email: cargo_real, reembolso, u otro.\n'+'DE: '+em.from+'\nASUNTO: '+em.subj+'\nFECHA: '+em.date+'\n'+'CONTENIDO:\n'+cleanBody+'\n\n'+(ctx?'PISTAS: '+ctx+'\n\n':'')+'cargo_real=cobro YA realizado con monto\n'+'reembolso=devolucion con monto\n'+'otro=envio pendiente, notificacion, marketing, sin monto cobrado\n\n'+'CRITICO: sin monto numerico confirmado → tipo=otro, amount=0\n\n'+'JSON:{"tipo":"cargo_real|reembolso|otro","merchant":"nombre establecimiento","amount":numero_o_0,"currency":"MXN|USD|EUR","date":"YYYY-MM-DD","category":"restaurantes|supermercado|entretenimiento|suscripciones|tecnologia|otro"}';const raw=await callClaude([{role:'user',content:[{type:'text',text:p}]}],600);const res=sj(raw);if(!res)return{tipo:'otro',merchant:'',amount:0,currency:'MXN',date:(em.date||'').slice(0,10),category:'otro'};if((res.tipo==='cargo_real'||res.tipo==='reembolso')&&!(parseFloat(res.amount||0)>0)&&regAmt>0){res.amount=regAmt;}return res;}

S.gmailImporting=true;S.gmailResults=[];S.gmailInfo='';localStorage.removeItem('vp_gmr');S.gmailStep='Conectando...';render();try{if(!S.gmailToken)await getGmailToken();S.gmailStep='Buscando emails...';render();const d60=new Date();d60.setDate(d60.getDate()-60);const after='after:'+d60.getFullYear()+'/'+(d60.getMonth()+1)+'/'+d60.getDate();const queries=['from:rappi '+after,'from:uber '+after,'from:ubereats '+after,'from:didi subject:(confirmada OR receipt OR recibo OR cobro) '+after,'from:amazon subject:(confirmacion OR order OR pedido OR recibo OR receipt OR membresia OR entregado) '+after,'{from:auto-confirm@amazon.com.mx from:prime@amazon.com.mx from:no-reply@amazon.com.mx} '+after,'from:zettle '+after,'from:stripe.com subject:(receipt OR invoice) '+after,'from:elevenlabs.io '+after,'from:1password.com subject:(invoice OR receipt) '+after,'subject:"recibo electronico" '+after,'subject:"recibo electrónico" '+after,'subject:rappi (recibo OR cargo OR cobro OR confirmacion) '+after,'subject:("your receipt" OR "tu recibo" OR "payment receipt") '+after,];let all=[];for(const q of queries){try{const m=await gmailSearch(q);all.push(...m);}
catch(e){console.warn('[Gmail] Query failed:',q,e);}}

S.gmailInfo='';const results=[];for(let i=0;i<newMsgs.length;i++){const msg=newMsgs[i];S.gmailStep='Analizando '+(i+1)+' de '+newMsgs.length+'...';render();try{const em=await gmailFetch(msg.id);const p=await parseEmail(em);console.log('[Gmail]',msg.id,'tipo:',p.tipo,'merchant:',p.merchant,'amount:',p.amount);S.importedEmailIds.push(msg.id);if((p.tipo==='cargo_real'||p.tipo==='reembolso')&&parseFloat(p.amount||0)>0){let _amt=parseFloat(p.amount||0);let _cur=p.currency||'MXN';let _origUSD=null;let _fxRate=null;if(_cur==='USD'&&_amt>0){const _rate=await fetchFXRate(p.date||em.date);if(_rate){_origUSD=_amt;_fxRate=parseFloat((_rate*1.035).toFixed(4));_amt=parseFloat((_amt*_fxRate).toFixed(2));_cur='MXN';}}results.push({emailId:msg.id,tipo:p.tipo,app:p.app||'',merchant:p.merchant||em.subj.replace(/^tu pedido de/i,'').replace(/your receipt from\s*/i,'').replace(/tu recibo de\s*/i,'').trim().slice(0,50)||'Sin nombre',amount:_amt,currency:_cur,originalUSD:_origUSD,fxRate:_fxRate,date:p.date||td(),time:p.time||'',orderId:p.order_id||'',items:p.items||'',category:p.category||'restaurantes',card:'',subj:em.subj,from:em.from,status:'pending',selected:false,skip:false,});}else{results.push({emailId:msg.id,tipo:p.tipo||'otro',subj:em.subj,app:p.app||'',selected:false,skip:true});}}catch(e){console.warn('[Gmail] Failed:',msg.id,e);}}
persist();S.gmailResults=results;S.gmailStep='';const found=results.filter(r=>!r.skip).length;if(found===0)S.gmailInfo='Se revisaron '+newMsgs.length+' emails pero ninguno tiene un cargo reconocible.';}catch(err){S.error='Error Gmail: '+(err.message||'Intenta de nuevo.');console.error('[Gmail] Error:',err);}
S.gmailImporting=false;render();}
