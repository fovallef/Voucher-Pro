else if(day!=='')alert('Ingresa un día entre 1 y 31.');}));document.querySelectorAll('[data-delcard]').forEach(b=>b.addEventListener('click',()=>{const name=b.dataset.delcard;if(!confirm(`¿Eliminar tarjeta"${name}"?`))return;if(S.entity==='personal')S.pCards=S.pCards.filter(c=>c.name!==name);else S.eCards=S.eCards.filter(c=>c.name!==name);persist();render();}));document.getElementById('sampleBtn')?.addEventListener('click',loadSample);document.getElementById('exportBtn')?.addEventListener('click',doExport);document.getElementById('importBtn')?.addEventListener('click',()=>document.getElementById('csvImportIn')?.click());document.getElementById('csvImportIn')?.addEventListener('change',doImportCSV);document.getElementById('saveGcidBtn')?.addEventListener('click',()=>{const v=(document.getElementById('gcidIn')?.value||'').trim();S.gmailClientId=v;persist();alert(v?'✅ Client ID guardado':'Client ID eliminado');render();});document.getElementById('changeKeyBtn')?.addEventListener('click',()=>{const box=document.getElementById('akChangeBox');if(box)box.style.display=box.style.display==='none'?'block':'none';});document.getElementById('akChangeSave')?.addEventListener('click',()=>{const v=(document.getElementById('akChangeInput')?.value||'').trim();if(!v||!v.startsWith('sk-ant-')){alert('Clave inválida. Debe comenzar con sk-ant-');return;}S.apiKey=v;persist();const box=document.getElementById('akChangeBox');if(box)box.style.display='none';alert('✅ API Key actualizada correctamente.');});document.getElementById('gmailSettingsBtn')?.addEventListener('click',()=>{S.tab='settings';S.screen='main';render();setTimeout(()=>document.getElementById('gcidIn')?.focus(),100);});document.getElementById('clearGmailBtn')?.addEventListener('click',()=>{const n=S.importedEmailIds?.length||0;if(!confirm('¿Borrar el historial de '+n+' emails procesados?\n\nEsto hará que Gmail los revise de nuevo en el próximo import.\nÚsalo si crees que algún cargo fue clasificado incorrectamente.'))return; t('✅ Importación completa\n'+imported+' registros importados\n'+skipped+' duplicados omitidos');}catch(err){alert('Error al importar: '+err.message);}};reader.readAsText(f,'UTF-8');e.target.value='';}function loadSample(){const n=new Date().toISOString();const SMPL=[{id:'s1',entity:'personal',card:'American Express',merchant:'Nobu Restaurant',category:'restaurantes',amount:2450,currency:'MXN',date:cm()+'-05',time:'21:30',msi:null,cfdi:null,status:'pending',isManual:false,createdAt:n},{id:'s2',entity:'personal',card:'BBVA',merchant:'Walmart Palmas',category:'supermercado',amount:1890,currency:'MXN',date:cm()+'-07',time:'12:15',msi:null,cfdi:null,status:'pending',isManual:false,createdAt:n},{id:'s3',entity:'personal',card:'Banamex',merchant:'Apple Store',category:'suscripciones',amount:29999,currency:'MXN',date:cm()+'-03',time:'14:00',msi:12,cfdi:null,status:'pending',isManual:false,createdAt:n},{id:'s4',entity:'personal',card:'American Express',merchant:'Aeromexico',category:'viajes',amount:8500,currency:'MXN',date:cm()+'-10',time:'09:45',msi:6,cfdi:null,status:'reconciled',isManual:false,createdAt:n},{id:'s5',entity:'personal',card:'Morgan Stanley',merchant:'Hyatt Regency',category:'viajes',amount:320,currency:'USD',date:cm()+'-08',time:'16:00',msi:null,cfdi:null,status:'pending',isManual:false,createdAt:n},{id:'s6',entity:'personal',card:'Santander',merchant:'Shell Periférico',category:'gasolina',amount:1200,currency:'MXN',date:cm()+'-06',time:'07:30',msi:null,cfdi:null,status:'pending',isManual:false,createdAt:n},{id:'s7',entity:'personal',card:'BBVA',merchant:'Liverpool Santa Fe',category:'ropa',amount:4300,currency:'MXN',date:cm()+'-09',time:'15:20',msi:3,cfdi:null,status:'pending',isManual:false,createdAt:n},{id:'s8',entity:'personal',card:'American Express',merchant:'Netflix',category:'suscripciones',amount:299,currency:'MXN',date:cm()+'-01',time:'10:00',msi:null,cfdi:null,status:'pending',isManual:true,isRecurring:true,createdAt:n},{id:'s9',entity:'personal', function doExport(){if(!S.txs.length){alert('No hay transacciones para exportar.');return;}const header=['Fecha','Hora','Entidad','Tarjeta','Comercio','Categoría','Monto','Moneda','MSI','Estado','Recurrente','Manual','RFC','Folio CFDI'];const q=v=>'"'+(String(v||'').replace(/"/g,'""'))+'"';const rows=S.txs.map(t=>{const ca=t.entity==='empresarial'?S.eCats:S.pCats;const cn=(ca.find(c=>c.id===t.category)||{}).n||t.category||'';return[t.date||'',t.time||'',t.entity||'personal',t.card||'',t.merchant||'',cn,t.amount||0,t.currency||'MXN',t.msi||'',t.status||'pending',t.isRecurring?'Sí':'No',t.isManual?'Sí':'No',(t.cfdi||{}).rfc||'',(t.cfdi||{}).folio||''].map(q).join(',');});const csv=[header.map(q).join(','),...rows].join('\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='VoucherPro_'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},100);}loadState();purgeOldImages();render();</script>
<script>function loadGSI(){return new Promise(res=>{if(window.google?.accounts){res();return;}const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=res;document.head.appendChild(s);});}
async function getGmailToken(){await loadGSI();return new Promise((res,rej)=>{const _t=setTimeout(()=>rej(new Error('Tiempo de espera agotado. Intenta de nuevo.')),20000);const client=google.accounts.oauth2.initTokenClient({client_id:S.gmailClientId,scope:'https://www.googleapis.com/auth/gmail.readonly',callback:(tok)=>{clearTimeout(_t);if(tok.error){rej(new Error(tok.error));return;}S.gmailToken=tok.access_token;res();}});client.requestAccessToken({prompt:''});});}
async function gmailSearch(q){const r=await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages?q='+encodeURIComponent(q)+'&maxResults=50',{headers:{Authorization:'Bearer '+S.gmailToken}});if(!r.ok){if(r.status===401)S.gmailToken=null;throw new Error('Gmail '+r.status);}

async function gmailFetch(id){const r=await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/'+id+'?format=full',{headers:{Authorization:'Bearer '+S.gmailToken}});const d=await r.json();const hh=d.payload?.headers||[];const subj=hh.find(h=>h.name==='Subject')?.value||'';const from=hh.find(h=>h.name==='From')?.value||'';const date=hh.find(h=>h.name==='Date')?.value||'';let txtBody='',htmlBody='';function xt(p){if(!p)return;if(p.mimeType==='text/plain'&&p.body?.data)txtBody+=atob(p.body.data.replace(/-/g,'+').replace(/_/g,'/'));else if(p.mimeType==='text/html'&&p.body?.data)htmlBody+=atob(p.body.data.replace(/-/g,'+').replace(/_/g,'/')).replace(/<[^>]+>/g,' ').replace(/&[a-z#0-9]+;/gi,' ');(p.parts||[]).forEach(xt);}xt(d.payload);const body=(txtBody.length>200?txtBody+' '+htmlBody:htmlBody||txtBody).replace(/\s+/g,' ').trim();return{id,subj,from,date:parseGmailDate(date),body:body.slice(0,6000)};}
function preClassifySubject(subject){const s=(subject||'').toLowerCase();if(s.includes('fue entregado')||s.includes('pedido entregado'))return 'cargo_real';if(s.includes('programad')||s.includes('scheduled')||s.includes('creado con éxito'))return 'pedido_programado';if(s.includes('reembolso')||s.includes('devolución')||s.includes('refund'))return 'reembolso';if(s.includes('cancelad'))return 'cancelado';return null;}
function extractAmount(body){const patterns=[/total\s+pagado[\s:$]*([0-9,]+\.?\d*)/i,/total\s+amount[\s:$]*([0-9,]+\.?\d*)/i,/amount\s+due[\s:$]*([0-9,]+\.?\d*)/i,/amount\s+charged[\s:$]*([0-9,]+\.?\d*)/i,/payment\s+amount[\s:$]*([0-9,]+\.?\d*)/i,/order\s+total[\s:$]*([0-9,]+\.?\d*)/i,/grand\s+total[\s:$]*([0-9,]+\.?\d*)/i,/importe[\s:$]*([0-9,]+\.?\d*)/i,/monto[\s:$]*([0-9,]+\.?\d*)/i,/subtotal[\s:$]*([0-9,]+\.?\d*)/i,/cargo\s+neto[\s:$]*([0-9,]+\.?\d*)/i,/total[\s:$]*([0-9,]+\.?\d*)\s*mxn/i,/USD\s+([0-9,]+\.?\d*)/i,/US\$\s*([0-9,]+\.?\d*)/i,/charged\s+([0-9,]+\.?\d*)/i,/you\s+(?:were|have been)\s+charged\s+(?:\$\s*)?([0-9,]+\.?\d*)/i,/(?:total|importe|subtotal)\s+(?:mxn|usd|eur)\s*\$?\s*([0-9,]+\.?\d*)/i,/\b(?:mxn)\s+([0-9,]+\.\d{2})/i,/\$\s*([0-9,]+\.\d{2})/];for(const p of patterns){const m=(body||'').match(p);if(m){const v=parseFloat(m[1].replace(/,/g,''));if(v>0&&v<1000000)return v;}}return null;}
function parseGmailDate(rawDate){if(!rawDate)return td();try{const d=new Date(rawDate);if(!isNaN(d.getTime())){return d.toLocaleDateString('en-CA',{timeZone:'America/Mexico_City'});}}catch(e){}const m=(rawDate||'').match(/(\d{4}-\d{2}-\d{2})/);return m?m[1]:td();}
function extractDate(body){const patterns=[/(\d{4}-\d{2}-\d{2})\s+\d{2}:\d{2}/,/(\d{4}-\d{2}-\d{2})/];for(const p of patterns){const m=(body||'').match(p);if(m){const dt=new Date(m[1]);if(!isNaN(dt.getTime()))return m[1];}}return null;}
function cleanEmailBody(html){const stripped=(html||'').replace(/<[^>]+>/g,' ').replace(/&[a-z#0-9]+;/gi,' ');const lines=stripped.split(/\n+/).map(l=>l.replace(/\s+/g,' ').trim()).filter(l=>l.length>3);const relevant=lines.filter(l=>/\$|total|pagado|pedido|orden|order|entregado|monto|importe|receipt|invoice|charged|amount|usd|mxn|cobro|payment|paid|suscripci|membresia|membresía/i.test(l));return(relevant.length>0?relevant.join(' | '):stripped.replace(/\s+/g,' ')).slice(0,2500);}
async function parseEmail(em){const s=(em.subj||'').toLowerCase();const fromL=(em.from||'').toLowerCase();if(/programad|scheduled|en camino|out for delivery|enviado|shipped|tracking/i.test(s)||/hemos recibido|order received|pedido recibido/.test(s)||s.includes('cancelad')||/^entregado[:\s]/i.test(em.subj||'')){return{tipo:'otro',merchant:'',amount:0,currency:'MXN',date:(em.date||'').slice(0,10),category:'otro'};}const regAmt=extractAmount(em.body)||extractAmount(cleanEmailBody(em.body));const isReceiptSubj=s.includes('receipt')||s.includes('invoice')||s.includes('recibo')||s.includes('factura');const isDeliverySubj=s.includes('fue entregado')||s.includes('pedido entregado')||/^entregado[:\s]/i.test(s);const isRappiReceipt=/^pedido:\s*['"]/.test(em.subj)&&(fromL.includes('rappi')||fromL.includes('recibos'));if(isReceiptSubj||isDeliverySubj||isRappiReceipt){const isAmzDelivery=/^entregado[:\s]/i.test(s);const rawMerchant=isAmzDelivery?'Amazon':(em.subj.replace(/your receipt from\s*/i,'').replace(/tu recibo de\s*/i,'').replace(/^recibo de\s*/i,'').replace(/^pedido:\s*/i,'').replace(/francisco ovalle felix,?\s*/i,'').replace(/#[0-9-]+/g,'').replace(/\|\s*pedido.*/i,'').replace(/fue entregado.*/i,'').replace(/tu pedido de\s*/i,'').replace(/['"]*/g,'').trim().slice(0,60)||'Sin nombre');const isForeign=fromL.includes('elevenlabs')||fromL.includes('stripe')||fromL.includes('paypal');let finalAmt=regAmt;if(!finalAmt){try{const cSnippet=cleanEmailBody(em.body).slice(0,800);const qa=await callClaude([{role:'user',content:[{type:'text',text:'Monto total cobrado en este recibo. Responde SOLO con el número (ej: 1234.56). Si no hay monto, responde: 0.\n\n'+cSnippet}]}],80);const qn=parseFloat((qa||'0').replace(/[^0-9.]/g,''));if(qn>0)finalAmt=qn;}catch(e){}}return{tipo:'cargo_real',merchant:rawMerchant,amount:finalAmt||0,currency:isForeign?'USD':'MXN',date:extractDate(em.body)||em.date,category:isDeliverySubj?'restaurantes':'suscripciones'};}const cleanBody=cleanEmailBody(em.body);let ctx='';if(fromL.includes('stripe'))ctx+='Remitente Stripe. ';if(fromL.includes('amazon'))ctx+='Email Amazon. ';if(fromL.includes('zettle')||fromL.includes('izettle'))ctx+='Recibo Zettle. ';if(fromL.includes('paypal'))ctx+='Email PayPal. ';if(regAmt&&regAmt>0)ctx+='Monto encontrado: '+regAmt+'. ';const p='Clasifica este email: cargo_real, reembolso, u otro.\n'+'DE: '+em.from+'\nASUNTO: '+em.subj+'\nFECHA: '+em.date+'\n'+'CONTENIDO:\n'+cleanBody+'\n\n'+(ctx?'PISTAS: '+ctx+'\n\n':'')+'cargo_real=cobro YA realizado con monto\n'+'reembolso=devolucion con monto\n'+'otro=envio pendiente, notificacion, marketing, sin monto cobrado\n\n'+'CRITICO: sin monto numerico confirmado → tipo=otro, amount=0\n\n'+'JSON:{"tipo":"cargo_real|reembolso|otro","merchant":"nombre establecimiento","amount":numero_o_0,"currency":"MXN|USD|EUR","date":"YYYY-MM-DD","category":"restaurantes|supermercado|entretenimiento|suscripciones|tecnologia|otro"}';const raw=await callClaude([{role:'user',content:[{type:'text',text:p}]}],600);const res=sj(raw);if(!res)return{tipo:'otro',merchant:'',amount:0,currency:'MXN',date:(em.date||'').slice(0,10),category:'otro'};if((res.tipo==='cargo_real'||res.tipo==='reembolso')&&!(parseFloat(res.amount||0)>0)&&regAmt>0){res.amount=regAmt;}return res;}

persist();S.gmailResults=results;S.gmailStep='';const found=results.filter(r=>!r.skip).length;if(found===0)S.gmailInfo='Se revisaron '+newMsgs.length+' emails pero ninguno tiene un cargo reconocible.';}catch(err){S.error='Error Gmail: '+(err.message||'Intenta de nuevo.');console.error('[Gmail] Error:',err);}

ce(0,7);S.tab='history';}render();});}
