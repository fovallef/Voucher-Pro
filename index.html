imp.map((r,i)=>{const isRef=r.tipo==='reembolso';return'<div style="background:'+(isRef?'rgba(16,185,129,.08)':'var(--bg2)')+';border:1px solid '+(isRef?'rgba(16,185,129,.3)':'var(--bd)')+';border-radius:14px;padding:12px;margin-bottom:8px"><div style="display:flex;align-items:start;gap:10px"><input type="checkbox" data-gmidx="'+i+'" '+(r.selected?'checked':'')+' style="margin-top:3px;width:16px;height:16px;flex-shrink:0;cursor:pointer"><div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between"><div><p style="font-weight:700;font-size:13px">'+esc(r.merchant)+'</p><p style="font-size:11px;color:#94a3b8">'+esc(r.app)+' · '+r.date+(r.time?' '+r.time:'')+'</p>'+(r.items?'<p style="font-size:11px;color:#64748b">'+esc(r.items)+'</p>':'')+(r.orderId?'<p style="font-size:10px;color:#475569;font-family:monospace">Pedido: '+esc(r.orderId)+'</p>':'')+'</div><div style="text-align:right;flex-shrink:0;margin-left:8px"><p style="font-weight:700;font-size:14px;color:'+(isRef?'#10b981':'var(--tx)')+'">'+(isRef?'+':'-')+fS(Math.abs(r.amount))+'</p><span style="font-size:9px;padding:2px 6px;border-radius:4px;font-weight:700;background:'+(isRef?'rgba(16,185,129,.2)':'rgba(99,102,241,.2)')+';color:'+(isRef?'#34d399':'#a5b4fc')+'">'+(isRef?'💚 REEMBOLSO':'💳 CARGO')+'</span></div></div></div></div></div>';}).join('')+
'<button class="btn bp" id="confirmGmailBtn" '+(imp.filter(r=>r.status==="approved").length?'':'disabled')+'>✅ Registrar '+imp.filter(r=>r.status==="approved").length+' aprobada'+(imp.filter(r=>r.status==="approved").length!==1?'s':'')+'</button>':'')+
(skipped.length?'<p class="stit" style="margin-top:8px;color:#475569">Ignorados ('+skipped.length+')</p>'+skipped.map(r=>'<div style="background:var(--bg3);border-radius:10px;padding:8px 12px;margin-bottom:6px;display:flex;justify-content:space-between"><p style="font-size:12px;color:#475569;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(r.subj)+'</p><span style="font-size:10px;color:#334155;background:var(--bg2);padding:2px 6px;border-radius:4px;flex-shrink:0;margin-left:8px">'+r.tipo+'</span></div>').join(''):'')+
(!S.gmailResults.length&&!S.gmailImporting?'<div class="card"><p style="font-weight:700;font-size:13px;margin-bottom:8px">¿Cómo funciona?</p>'+['📧 Autoriza Gmail una sola vez','🤖 Claude diferencia cargos reales vs programados vs reembolsos','💚 Reembolsos se importan como ingreso positivo','✅ Tú eliges cuáles importar'].map(t=>'<p style="font-size:12px;color:#94a3b8;padding:4px 0;border-bottom:1px solid var(--bg3)">'+t+'</p>').join('')+'<div style="background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.2);border-radius:10px;padding:10px;margin-top:10px"><p style="font-size:11px;color:#fbbf24;font-weight:600">📌 Amazon desde Hotmail:</p><p style="font-size:11px;color:#94a3b8">Crea una regla en Hotmail para reenviar emails de amazon.com.mx a tu Gmail.</p></div></div>':'');}
function attachGmail(){document.getElementById('gmailImportBtn')?.addEventListener('click',doGmailImport);document.querySelectorAll('[data-gmopen]').forEach(el=>{el.addEventListener('click',()=>{S.gmailDetail=parseInt(el.dataset.gmopen);render();});});document.getElementById('confirmGmailBtn')?.addEventListener('click',doConfirmGmail);document.getElementById('toggleAllGm')?.addEventListener('click',()=>{const im=S.gmailResults.filter(r=>!r.skip);const all=im.every(r=>r.selected);im.forEach(r=>r.selected=!all);render();});document.querySelectorAll('[data-gmidx]').forEach(cb=>{cb.addEventListener('change',()=>{const idx=parseInt(cb.dataset.gmidx);const im=S.gmailResults.filter(r=>!r.skip);if(im[idx])im[idx].selected=cb.checked;const s=im.filter(r=>r.selected).length;const btn=document.getElementById('confirmGmailBtn');if(btn){btn.disabled=!s;btn.textContent='✅ Importar '+s+' transacción'+(s!==1?'es':'');}});});}
function rGmailDetail(){const idx=S.gmailDetail;const imp=S.gmailResults.filter(r=>!r.skip);const r=imp[idx];if(!r)return'';const isRef=r.tipo==='reembolso';const cts=S.pCats;const cds=S.pCards.map(c=>c.name);return'<button class="bbk" id="gmailDetailBack">← Volver a resultados</button>'+
'<h2 style="font-weight:700;font-size:15px;margin-bottom:12px">Revisar email</h2>'+
'<div style="background:var(--bg3);border-radius:14px;padding:12px;margin-bottom:14px">'+
'<p style="font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px">Asunto</p>'+
'<p style="font-size:12px;margin-bottom:6px">'+esc(r.subj||'Sin asunto')+'</p>'+
'<p style="font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px">App</p>'+
'<p style="font-size:13px;font-weight:600;margin-bottom:6px">'+esc(r.app||'')+'</p>'+
(r.orderId?'<p style="font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px">No. pedido</p><p style="font-size:12px;font-family:monospace;margin-bottom:6px">'+esc(r.orderId)+'</p>':'')+
(r.items?'<p style="font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px">Resumen</p><p style="font-size:12px;color:#cbd5e1;line-height:1.5">'+esc(r.items)+'</p>':'')+
'</div>'+
'<div class="fld"><label>Establecimiento</label><input class="inp" id="gd_merchant" value="'+esc(r.merchant||r.app||'')+'" placeholder="Nombre del comercio"></div>'+
'<div class="fld"><label>Categoría</label><select class="inp" id="gd_category">'+cts.map(c=>'<option value="'+c.id+'" '+(r.category===c.id?'selected':'')+'>'+c.ic+' '+esc(c.n)+'</option>').join('')+'</select></div>'+
'<div style="display:flex;gap:8px;margin-bottom:10px">'+
'<div class="fld" style="flex:1"><label>Monto</label><input class="inp" type="number" id="gd_amount" value="'+Math.abs(r.amount||0)+'"></div>'+
'<div class="fld" style="width:90px"><label>Moneda</label><select class="inp" id="gd_currency"><option '+(r.currency==='MXN'?'selected':'')+'>MXN</option><option '+(r.currency==='USD'?'selected':'')+'>USD</option></select></div>'+
'</div>'+
'<div class="fld"><label>Tarjeta</label><select class="inp" id="gd_card">'+cds.map(c=>'<option value="'+esc(c)+'" '+(r.card===c?'selected':'')+'>'+esc(c)+'</option>').join('')+'</select></div>'+
'<div class="fld"><label>Notas (opcional)</label><input class="inp" id="gd_notes" value="'+esc(r.notes||'')+'" placeholder="Agrega una nota…"></div>'+
'<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">'+
'<button class="btn br" id="gd_reject" style="margin:0">❌ Rechazar</button>'+
'<button class="btn be" id="gd_approve" style="margin:0">✅ Aprobar</button>'+
'</div>'+
(r.status==='approved'?'<div style="background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);border-radius:10px;padding:10px;margin-top:8px"><p style="color:#34d399;font-size:13px;font-weight:600;text-align:center;margin-bottom:6px">✅ Aprobado — se registrará al confirmar</p><button class="btn bs" id="gd_reset" style="margin:0;padding:8px;font-size:12px">↩️ Quitar aprobación</button></div>':'')+
(r.status==='rejected'?'<div style="background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:10px;padding:10px;margin-top:8px;text-align:center"><p style="color:#f87171;font-size:13px;font-weight:600">❌ Rechazado — no se registrará</p></div>':'');}
function attachGmailDetail(){const idx=S.gmailDetail;const imp=S.gmailResults.filter(r=>!r.skip);const r=imp[idx];if(!r)return;const save=()=>{r.merchant=document.getElementById('gd_merchant')?.value||r.merchant;r.category=document.getElementById('gd_category')?.value||r.category;r.amount=parseFloat(document.getElementById('gd_amount')?.value)||r.amount;r.currency=document.getElementById('gd_currency')?.value||r.currency;r.card=document.getElementById('gd_card')?.value||r.card;r.notes=document.getElementById('gd_notes')?.value||'';};document.getElementById('gmailDetailBack')?.addEventListener('click',()=>{save();S.gmailDetail=null;render();});document.getElementById('gd_approve')?.addEventListener('click',()=>{save();r.status='approved';r.selected=true;S.gmailDetail=null;render();});document.getElementById('gd_reject')?.addEventListener('click',()=>{save();r.status='rejected';r.selected=false;S.gmailDetail=null;render();});document.getElementById('gd_reset')?.addEventListener('click',()=>{r.status='pending';r.selected=false;render();});}</script>
