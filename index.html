-Monto igual o muy cercano(±1%)
-Fecha dentro de 7 días
Responde ÚNICAMENTE con JSON válido,sin texto previo ni posterior:{"card_name":"banco detectado y últimos 4 dígitos si aparecen","cut_date":"YYYY-MM-DD","total_balance":número,"currency":"MXN","statement_txs":[{"merchant":"nombre exacto del comercio","amount":número,"date":"YYYY-MM-DD","matched_id":"ID o null","status":"matched|unrecognized"}],"summary":"Banco: X. Período: X. Total cargos encontrados: N por $X MXN. Conciliados: N. No reconocidos: N."}`;const raw=await callClaude([{role:'user',content:[{type:'document',source:{type:'base64',media_type:'application/pdf',data}},{type:'text',text:prompt}]}],3000);const res=sj(raw);if(res.statement_txs){const ids=res.statement_txs.filter(t=>t.matched_id).map(t=>t.matched_id);S.txs=S.txs.map(t=>ids.includes(t.id)?{...t,status:'reconciled'}:t);persist();}
const stmt={id:uid(),entity:S.entity,bank:res.card_name||'Desconocido',cutDate:res.cut_date||td(),totalBalance:res.total_balance||0,currency:res.currency||'MXN',totalCharges:(res.statement_txs||[]).filter(t=>t.status!=='credit').length,matched:(res.statement_txs||[]).filter(t=>t.status==='matched').length,unrecognized:(res.statement_txs||[]).filter(t=>t.status==='unrecognized').length,summary:res.summary||'',uploadedAt:new Date().toISOString()};S.statements.unshift(stmt);persist();S.reconRes=res;S.tab='reconcile';S.screen='reconResult';}catch(err){console.error('[VoucherPro] PDF error:',err);S.error='Error al procesar PDF: '+(err.message||'Intenta de nuevo. Verifica que el PDF tenga texto seleccionable.');}
S.loading=false;render();e.target.value='';}
function stmtCard(s){const unrecBg=(s.unrecognized||0)>0?'rgba(239,68,68,.1)':'rgba(16,185,129,.05)';const unrecColor=(s.unrecognized||0)>0?'#ef4444':'#10b981';const summary=s.summary?'<p style="font-size:11px;color:#64748b;line-height:1.4">'+esc(s.summary)+'</p>':'';return'<div style="background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:8px">'+
'<div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:6px">'+
'<div><p style="font-weight:700;font-size:13px">'+esc(s.bank)+'</p>'+
'<p style="font-size:11px;color:#94a3b8">Corte: '+s.cutDate+' · Subido: '+(s.uploadedAt||'').slice(0,10)+'</p></div>'+
'<p style="font-weight:700;font-size:14px;color:#10b981">'+fS(s.totalBalance||0)+'</p></div>'+

'<div style="text-align:center;background:var(--bg3);border-radius:8px;padding:5px"><p style="font-size:14px;font-weight:700">'+(s.totalCharges||0)+'</p><p style="font-size:9px;color:#94a3b8">Cargos</p></div>'+
'<div style="text-align:center;background:rgba(16,185,129,.1);border-radius:8px;padding:5px"><p style="font-size:14px;font-weight:700;color:#10b981">'+(s.matched||0)+'</p><p style="font-size:9px;color:#94a3b8">Conciliados</p></div>'+
'<div style="text-align:center;background:'+unrecBg+';border-radius:8px;padding:5px"><p style="font-size:14px;font-weight:700;color:'+unrecColor+'">'+(s.unrecognized||0)+'</p><p style="font-size:9px;color:#94a3b8">No reconoc.</p></div></div>'+
summary+
'<button class="btn bs" style="margin-top:8px;margin-bottom:0;padding:7px;font-size:11px" data-delstmt="'+s.id+'">🗑️ Eliminar registro</button></div>';}
function rReconcile(){const pend=S.txs.filter(t=>t.entity===S.entity&&t.status==='pending').length;const rec=S.txs.filter(t=>t.entity===S.entity&&t.status==='reconciled').length;const disp=S.txs.filter(t=>t.entity===S.entity&&t.status==='disputed');const msi=S.txs.filter(t=>t.entity==='personal'&&t.msi&&t.status!=='reconciled');const stmts=S.statements.filter(s=>s.entity===S.entity);return`<div class="card"style="text-align:center"><div style="font-size:36px;margin-bottom:8px">🔄</div><h2 style="font-weight:700;font-size:15px;margin-bottom:4px">Conciliación Mensual</h2><p style="font-size:12px;color:#94a3b8;margin-bottom:14px">Sube el estado de cuenta PDF y Claude concilia automáticamente con tus vouchers registrados.</p><button class="btn bv"id="pdfBtn">📄 Subir Estado de Cuenta PDF</button></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px"><div class="sbox"><div class="sl">Pendientes</div><div class="sv"style="color:#f59e0b;font-size:18px">${pend}</div></div><div class="sbox"><div class="sl">Conciliados</div><div class="sv"style="color:#10b981;font-size:18px">${rec}</div></div><div class="sbox"><div class="sl">En disputa</div><div class="sv"style="color:#ef4444;font-size:18px">${disp.length}</div></div></div>${stmts.length?`<p class="stit"style="margin-top:4px">📄 Historial de Estados de Cuenta(${stmts.length})</p>${stmts.map(s=>stmtCard(s)).join('')}`:''}
${disp.length?`<p class="stit"style="color:#ef4444">🚨 Disputas activas</p>${disp.map(t=>`<div style="background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.3);border-radius:14px;padding:12px;margin-bottom:8px"><div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:6px"><div><p style="font-weight:600;font-size:13px">${esc(t.merchant)}</p><p style="font-size:11px;color:#94a3b8">${esc(t.card)}· ${t.date}</p></div><p style="font-weight:700;font-size:13px;color:#ef4444">${fS(t.amount)}</p></div>${t.disputeNotes?`<p style="font-size:11px;color:#fca5a5;background:rgba(239,68,68,.1);border-radius:8px;padding:6px 8px">📝 ${esc(t.disputeNotes)}</p>`:''}<p style="font-size:10px;color:#64748b;margin-top:4px">Disputado el ${t.disputeDate||t.date}</p><button class="btn bs"style="margin-top:8px;margin-bottom:0;padding:8px;font-size:12px"data-resolve="${t.id}">✅ Marcar como resuelto</button></div>`).join('')}`:''}
${S.entity==='personal'&&msi.length?`<p class="stit"style="margin-top:4px">📅 MSI Activos</p>${msi.map(t=>{const mp=Math.floor((Date.now()-new Date(t.createdAt))/(1000*60*60*24*30));const rem=Math.max(0,(t.msi||0)-mp);const pct=Math.min(100,(mp/(t.msi||1))*100);return`<div class="card"style="padding:12px"><div style="display:flex;justify-content:space-between;margin-bottom:6px"><div><p style="font-size:13px;font-weight:600">${esc(t.merchant)}</p><p style="font-size:11px;color:#94a3b8">${esc(t.card)}· ${t.msi}MSI</p></div><div style="text-align:right"><p style="font-weight:700;font-size:13px">${fS(t.amount)}</p><p style="font-size:11px;color:#94a3b8">${fS(t.amount/t.msi)}/mes</p></div></div><div class="msib"><div class="msif"style="width:${pct}%"></div></div><p style="font-size:11px;color:#94a3b8">${rem}meses restantes de ${t.msi}</p></div>`;}).join('')}`:''}`;}
function attachReconcile(){document.getElementById('pdfBtn')?.addEventListener('click',()=>document.getElementById('pdfIn')?.click());document.querySelectorAll('[data-delstmt]').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.delstmt;if(!confirm('¿Eliminar este registro de estado de cuenta?'))return;S.statements=S.statements.filter(s=>s.id!==id);persist();render();}));document.querySelectorAll('[data-resolve]').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.resolve;S.txs=S.txs.map(t=>t.id===id?{...t,status:'reconciled',resolvedDate:td()}:t);persist();render();}));}
function rReconResult(){const r=S.reconRes;if(!r)return'';const matched=(r.statement_txs||[]).filter(t=>t.status==='matched');const unrecog=(r.statement_txs||[]).filter(t=>t.status==='unrecognized');const totalCharges=matched.length+unrecog.length;const totalAmt=(r.statement_txs||[]).reduce((s,t)=>s+parseFloat(t.amount||0),0);return`<button class="bbk"id="reconBack">← Volver</button><div style="background:linear-gradient(135deg,rgba(139,92,246,.12),var(--bg2));border:1px solid rgba(139,92,246,.25);border-radius:16px;padding:14px;margin-bottom:14px"><p style="font-size:11px;color:#94a3b8;margin-bottom:2px">Estado de Cuenta analizado</p><h2 style="font-weight:700;font-size:16px;margin-bottom:8px">${esc(r.card_name||'Desconocido')}</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><p style="font-size:10px;color:#94a3b8">Fecha de corte</p><p style="font-weight:600;font-size:13px">${r.cut_date||'N/A'}</p></div><div><p style="font-size:10px;color:#94a3b8">Total a pagar</p><p style="font-weight:700;font-size:14px;color:#10b981">${fS(r.total_balance||0)}${r.currency||'MXN'}</p></div><div><p style="font-size:10px;color:#94a3b8">Cargos identificados</p><p style="font-weight:600;font-size:13px">${totalCharges}</p></div><div><p style="font-size:10px;color:#94a3b8">Suma de cargos</p><p style="font-weight:600;font-size:13px">${fS(totalAmt)}</p></div></div></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px"><div class="sbox"style="text-align:center"><div class="sv"style="color:#10b981;font-size:20px">${matched.length}</div><div class="sl">Conciliados</div></div><div class="sbox"style="text-align:center"><div class="sv"style="color:#ef4444;font-size:20px">${unrecog.length}</div><div class="sl">No reconoc.</div></div><div class="sbox"style="text-align:center"><div class="sv"style="font-size:16px">${fS(r.total_balance||0)}</div><div class="sl">Saldo</div></div></div>${r.summary?`<div style="background:#1e293b;border-radius:10px;padding:10px;margin-bottom:14px"><p style="font-size:12px;color:#94a3b8;line-height:1.5">🤖 ${esc(r.summary)}</p></div>`:''}
${unrecog.length?`<p class="stit"style="color:#ef4444">🚨 Cargos no reconocidos — elige una acción</p>${unrecog.map((t,i)=>`<div style="background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.3);border-radius:16px;padding:14px;margin-bottom:10px"id="urCard_${i}"><div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:10px"><div><p style="font-weight:700;font-size:14px">${esc(t.merchant)}</p><p style="font-size:11px;color:#94a3b8">${t.date}· ${fS(t.amount)}${t.currency||'MXN'}</p></div><span style="font-size:22px">❓</span></div><p style="font-size:11px;color:#94a3b8;margin-bottom:8px">¿Qué es este cargo?</p><div style="display:flex;flex-direction:column;gap:6px"><button class="btn be"style="margin:0;padding:10px;font-size:12px"data-alta="${i}">✅ Darlo de alta como gasto nuevo</button><button class="btn bp"style="margin:0;padding:10px;font-size:12px"data-recur="${i}">🔁 Es una suscripción recurrente</button><button class="btn br"style="margin:0;padding:10px;font-size:12px"data-disputar="${i}">🚨 No lo reconozco — disputar con el banco</button></div></div>`).join('')}`:''}
${matched.length?`<p class="stit"style="color:#10b981;margin-top:4px">✅ Conciliados correctamente(${matched.length})</p>${matched.map(t=>`<div style="background:rgba(16,185,129,.06);border:1px solid rgba(16,185,129,.2);border-radius:12px;padding:11px;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center"><div><p style="font-size:13px;font-weight:500">${esc(t.merchant)}</p><p style="font-size:11px;color:#94a3b8">${t.date}</p></div><p style="font-size:13px;font-weight:700">${fS(t.amount)}</p></div>`).join('')}`:''}`;}
function attachReconResult(){const r=S.reconRes;if(!r)return;const unrecog=(r.statement_txs||[]).filter(t=>t.status==='unrecognized');document.getElementById('reconBack')?.addEventListener('click',()=>{S.screen='main';render();});document.querySelectorAll('[data-alta]').forEach(b=>b.addEventListener('click',()=>{const t=unrecog[parseInt(b.dataset.alta)];if(!t)return;S.manualForm={merchant:t.merchant||'',amount:t.amount||'',currency:t.currency||'MXN',date:t.date||td(),time:nt(),card:cds()[0],category:cats()[cats().length-1].id,msi:null,cfdi:{rfc:'',folio:''},isRecurring:false};S.screen='main';S.tab='manual';render();setTimeout(()=>document.getElementById('m_amt')?.focus(),150);}));document.querySelectorAll('[data-recur]').forEach(b=>b.addEventListener('click',()=>{const t=unrecog[parseInt(b.dataset.recur)];if(!t)return;S.manualForm={merchant:t.merchant||'',amount:t.amount||'',currency:t.currency||'MXN',date:t.date||td(),time:nt(),card:cds()[0],category:'suscripciones',msi:null,cfdi:{rfc:'',folio:''},isRecurring:true};S.screen='main';S.tab='manual';render();setTimeout(()=>document.getElementById('m_amt')?.focus(),150);}));document.querySelectorAll('[data-disputar]').forEach(b=>b.addEventListener('click',()=>{const t=unrecog[parseInt(b.dataset.disputar)];if(!t)return;S.disputeModal={tx:t};render();}));}
function rDisputeModal(){const m=S.disputeModal;if(!m)return'';return`<div class="modal-overlay"id="dispOverlay"><div class="modal"><p class="modal-title">🚨 Disputar cargo con el banco</p><div style="background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);border-radius:12px;padding:12px;margin-bottom:14px"><p style="font-weight:700;font-size:14px">${esc(m.tx.merchant)}</p><p style="font-size:12px;color:#94a3b8;margin-top:2px">${m.tx.date}· ${fS(m.tx.amount)}${m.tx.currency||'MXN'}</p></div><div class="fld"><label>Notas para el banco(opcional)</label><input class="inp"id="dispNotes"placeholder="ej. Nunca realicé esta compra, cargo duplicado…"></div><button class="btn br"id="dispConfirm"style="margin-bottom:8px">🚨 Confirmar disputa</button><button class="btn bs"id="dispCancel">Cancelar</button></div></div>`;}

render();setTimeout(()=>alert(`Cargo"${m.tx.merchant}"marcado como disputa.\n\nEncuéntralo en:\n📋 Historial →"En disputa"\n🔄 Conciliar → Disputas activas`),100);});}
